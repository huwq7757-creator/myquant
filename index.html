<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nasdaq Quant Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .matrix-dot { transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none">

    <div id="emergency-banner" class="hidden w-full py-2.5 px-4 text-center text-xs font-bold uppercase tracking-wider animate-pulse"></div>

    <main class="p-4 space-y-4 flex-1">
        
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl relative overflow-hidden">
            <div class="text-xs text-slate-400 font-medium tracking-widest uppercase mb-1">今日纳指 ETF 建议总仓位</div>
            <div id="target-position" class="text-6xl font-black text-amber-400 my-2 tracking-tighter">--%</div>
            <div id="market-regime" class="text-sm font-semibold text-slate-300 px-3 py-1 bg-slate-800/60 rounded-full inline-block">
                核心量化引擎初始化...
            </div>
            <div id="loading-bar" class="absolute bottom-0 left-0 h-1 bg-emerald-500 w-0 transition-all duration-300"></div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">二维动态坐标矩阵</span>
                <span id="matrix-coords" class="text-xs font-mono text-slate-400">(X:0, Y:0)</span>
            </div>
            
            <div class="relative w-full aspect-square bg-slate-950 rounded-xl p-px border border-slate-800 overflow-hidden">
                <div id="matrix-container" class="absolute inset-0 grid grid-cols-7 grid-rows-7 gap-px bg-slate-800/80 z-10"></div>
                
                <div id="quantum-dot" class="hidden absolute w-4 h-4 bg-rose-500 rounded-full border-2 border-white shadow-[0_0_14px_rgba(244,63,94,1)] z-30 transform -translate-x-1/2 -translate-y-1/2 animate-ping matrix-dot"></div>
                <div id="quantum-dot-solid" class="hidden absolute w-3 h-3 bg-rose-500 rounded-full border border-white shadow-[0_0_8px_rgba(244,63,94,0.8)] z-30 transform -translate-x-1/2 -translate-y-1/2 matrix-dot"></div>
                
                <div id="dot-week" class="hidden absolute w-2.5 h-2.5 bg-amber-500 rounded-full border border-white shadow-[0_0_6px_rgba(245,158,11,0.8)] z-20 transform -translate-x-1/2 -translate-y-1/2 matrix-dot"></div>
                <div id="dot-month" class="hidden absolute w-2.5 h-2.5 bg-sky-400 rounded-full border border-white shadow-[0_0_6px_rgba(56,189,248,0.8)] z-20 transform -translate-x-1/2 -translate-y-1/2 matrix-dot"></div>
                <div id="dot-quarter" class="hidden absolute w-2.5 h-2.5 bg-slate-300 rounded-full border border-slate-600 shadow-[0_0_5px_rgba(203,213,225,0.6)] z-20 transform -translate-x-1/2 -translate-y-1/2 matrix-dot"></div>
            </div>
            
            <div class="flex justify-center items-center gap-3 text-[10px] text-slate-400 mt-2.5 bg-slate-950/50 py-1.5 rounded-lg border border-slate-800/60">
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span>最新位置</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span>上周(5日)</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-sky-400"></span>上月(21日)</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-300"></span>上季(63日)</div>
            </div>
            
            <div class="flex justify-between text-[10px] text-slate-500 mt-2 px-1">
                <span>← 宏观收紧 (X-)</span>
                <span>宏观放水 (X+) →</span>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3">
            <h3 class="text-xs font-bold tracking-wider text-slate-400 uppercase">底层探测器实时状态</h3>
            
            <div class="space-y-2.5">
                <div class="flex items-center justify-between bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/40">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium">当前宏观环境得分 (X轴)</span>
                        <span class="text-[10px] text-slate-500">美债长线变动与联邦利率常数衍生值</span>
                    </div>
                    <span id="score-macro" class="text-sm font-mono font-bold text-slate-400">0</span>
                </div>
                <div class="flex items-center justify-between bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/40">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium">当前产业动能得分 (Y轴)</span>
                        <span class="text-[10px] text-slate-500">费城半导体相对强弱与大厂资本开支增速</span>
                    </div>
                    <span id="score-industry" class="text-sm font-mono font-bold text-slate-400">0</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-4 text-center border-t border-slate-900 bg-slate-950/80 backdrop-blur-md">
        <div class="text-[10px] text-slate-500 tracking-wider">
            数据链状态: <span id="sync-mode" class="text-amber-400">加载中</span> • <span id="sync-time">--:--:--</span>
        </div>
    </footer>

    <script>
        const CONFIG_2026 = { fedScore: 0, capexScore: 1, epsScore: 1 };
        const POSITION_MATRIX = {
            '3':  { '-3': 30, '-2': 40, '-1': 60, '0': 70, '1': 80,  '2': 90,  '3': 100 },
            '2':  { '-3': 20, '-2': 50, '-1': 60, '0': 70, '1': 70,  '2': 80,  '3': 90  },
            '1':  { '-3': 10, '-2': 20, '-1': 50, '0': 60, '1': 60,  '2': 70,  '3': 80  },
            '0':  { '-3': 0,  '-2': 10, '-1': 30, '0': 50, '1': 50,  '2': 60,  '3': 70  },
            '-1': { '-3': 0,  '-2': 0,  '-1': 10, '0': 30, '1': 40,  '2': 50,  '3': 60  },
            '-2': { '-3': 0,  '-2': 0,  '-1': 0,  '0': 10, '1': 20,  '2': 30,  '3': 40  },
            '-3': { '-3': 0,  '-2': 0,  '-1': 0,  '0': 0,  '1': 10,  '2': 20,  '3': 30  }
        };

        function initMatrixGrid() {
            const container = document.getElementById('matrix-container');
            container.innerHTML = '';
            for (let y = 3; y >= -3; y--) {
                for (let x = -3; x <= 3; x++) {
                    const block = document.createElement('div');
                    if (x >= 0 && y >= 0) block.className = "bg-emerald-950/40"; 
                    else if (x < 0 && y < 0) block.className = "bg-rose-950/30"; 
                    else block.className = "bg-slate-900"; 
                    container.appendChild(block);
                }
            }
        }

        function renderMatrixDot(id, x, y) {
            const dot = document.getElementById(id);
            if (!dot) return;
            const percentX = ((x + 3 + 0.5) / 7) * 100;
            const percentY = ((3 - y + 0.5) / 7) * 100;
            dot.style.left = `${percentX}%`; 
            dot.style.top = `${percentY}%`; 
            dot.classList.remove('hidden');
        }

        // 核心算法：抽取成通用函数，用来计算任意指定历史日期(idx)的坐标点
        function calculateXYForIndex(results, idx) {
            const ndxCloses = results[0].indicators.adjclose[0].adjclose;
            const soxCloses = results[1].indicators.adjclose[0].adjclose;
            const vxnCloses = results[2].indicators.adjclose[0].adjclose;
            const tnxCloses = results[3].indicators.adjclose[0].adjclose;

            const currentNDX = ndxCloses[idx];
            const currentSOX = soxCloses[idx];
            const currentVXN = vxnCloses[idx];
            const currentTNX = tnxCloses[idx];

            const oldIdx = Math.max(0, idx - 60); // 同样采用该历史节点前60天的回溯对比
            const ratioChange = ((currentSOX / currentNDX) - (soxCloses[oldIdx] / ndxCloses[oldIdx])) / (soxCloses[oldIdx] / ndxCloses[oldIdx]);
            const bondDiff = currentTNX - tnxCloses[oldIdx];

            let bondScore = bondDiff < -0.30 ? 1 : (bondDiff > 0.30 ? -1 : 0);
            let vxnAbsScore = currentVXN > 35 ? 1 : (currentVXN < 15 ? -1 : 0);
            let soxRatioScore = ratioChange > 0.05 ? 1 : (ratioChange < -0.05 ? -1 : 0);

            return {
                X: Math.max(-3, Math.min(3, CONFIG_2026.fedScore + bondScore + vxnAbsScore)),
                Y: Math.max(-3, Math.min(3, soxRatioScore + CONFIG_2026.capexScore + CONFIG_2026.epsScore)),
                currentVXN, currentNDX, ndxCloses
            };
        }

        function calculateFinalDecision(cur, w, m, q, vxnDayReturn = 0, ndxBias = 0, modeName = "内核内化推演") {
            let finalPosition = 0;
            let regimeText = "";
            const banner = document.getElementById('emergency-banner');

            if ((vxnDayReturn > 0.20 && ndxBias < -0.08) || ndxBias < -0.15) {
                finalPosition = 40;
                regimeText = "🚨 方案三：黄金坑极端超卖突击";
                banner.className = "w-full py-2.5 px-4 text-center text-xs font-bold bg-emerald-500 text-slate-950 block";
                banner.innerText = "🚨 应急多头防御激活：非理性砸盘，系统执行机械式强制买入！";
            } else {
                banner.className = "hidden";
                finalPosition = POSITION_MATRIX[cur.Y][cur.X];

                if (cur.X >= 0 && cur.Y >= 0) regimeText = "🟢 右上：戴维斯双击区 (放水 + AI加速)";
                else if (cur.X < 0 && cur.Y >= 0) regimeText = "🟡 左上：重力蹦迪区 (宏观重压 + AI动能强劲)";
                else if (cur.X >= 0 && cur.Y < 0) regimeText = "🟡 右下：虚胖流动性区 (缺乏核心产业催化)";
                else regimeText = "🔴 左下：戴维斯双杀区 (高压抽水 + 产业熄火)";

                // 渲染多点坐标系
                document.getElementById('matrix-coords').innerText = `(当前 X: ${cur.X > 0 ? '+' : ''}${cur.X}, Y: ${cur.Y > 0 ? '+' : ''}${cur.Y})`;
                renderMatrixDot('quantum-dot', cur.X, cur.Y);
                renderMatrixDot('quantum-dot-solid', cur.X, cur.Y);
                renderMatrixDot('dot-week', w.X, w.Y);
                renderMatrixDot('dot-month', m.X, m.Y);
                renderMatrixDot('dot-quarter', q.X, q.Y);
            }

            const posEl = document.getElementById('target-position');
            posEl.innerText = `${finalPosition}%`;
            if (finalPosition >= 70) posEl.className = "text-6xl font-black text-emerald-400 my-2 tracking-tighter";
            else if (finalPosition >= 40) posEl.className = "text-6xl font-black text-amber-400 my-2 tracking-tighter";
            else posEl.className = "text-6xl font-black text-rose-500 my-2 tracking-tighter";

            document.getElementById('market-regime').innerText = regimeText;
            document.getElementById('score-macro').innerText = `${cur.X > 0 ? '+' : ''}${cur.X}`;
            document.getElementById('score-industry').innerText = `${cur.Y > 0 ? '+' : ''}${cur.Y}`;
            document.getElementById('sync-mode').innerText = modeName;
            document.getElementById('sync-mode').className = modeName === "智能内化推演" ? "text-amber-400" : "text-emerald-400";
            document.getElementById('sync-time').innerText = new Date().toLocaleTimeString();
        }

        function executeFallback() {
            // 本地协同模拟轨迹线 (当前:-1,2  上周:0,2  上月:-1,1  上季:-2,1)
            calculateFinalDecision({X: -1, Y: 2}, {X: 0, Y: 2}, {X: -1, Y: 1}, {X: -2, Y: 1}, 0, 0, "智能内化推演");
        }

        async function fetchMarketData() {
            document.getElementById('loading-bar').style.width = '40%';
            const tickers = ['%5ENDX', '%5ESOX', '%5EVXN', '%5ETNX'];
            // 扩充至 6个月数据源，确保上季度历史追溯计算的完整性
            const proxy = (t) => `https://corsproxy.io/?${encodeURIComponent(`https://query1.financeapp.yahoo.com/v8/finance/chart/${t}?interval=1d&range=6mo`)}`;

            try {
                const promises = tickers.map(t => fetch(proxy(t)).then(r => r.json()).then(data => data.chart.result[0]));
                const results = await Promise.all(promises);
                document.getElementById('loading-bar').style.width = '100%';

                const len = results[0].indicators.adjclose[0].adjclose.length;
                if (len < 1) throw new Error("无有效数据");

                // 分段截取交易日索引
                const idxCur = len - 1;
                const idxWeek = Math.max(0, len - 1 - 5);    // 约 1 周 (5个交易日)
                const idxMonth = Math.max(0, len - 1 - 21);  // 约 1 个月 (21个交易日)
                const idxQuarter = Math.max(0, len - 1 - 63); // 约 1 个季度 (63个交易日)

                const curPoints = calculateXYForIndex(results, idxCur);
                const weekPoints = calculateXYForIndex(results, idxWeek);
                const monthPoints = calculateXYForIndex(results, idxMonth);
                const quarterPoints = calculateXYForIndex(results, idxQuarter);

                const prevVXN = results[2].indicators.adjclose[0].adjclose[idxCur - 1] || curPoints.currentVXN;
                const ndxClosesArr = results[0].indicators.adjclose[0].adjclose;
                const ndxMA20 = ndxClosesArr.slice(Math.max(0, idxCur - 19), idxCur + 1).reduce((a, b) => a + b, 0) / Math.min(20, idxCur + 1);

                const vxnDayReturn = (curPoints.currentVXN - prevVXN) / prevVXN;
                const ndxBias = (curPoints.currentNDX - ndxMA20) / ndxMA20;

                calculateFinalDecision(curPoints, weekPoints, monthPoints, quarterPoints, vxnDayReturn, ndxBias, "华尔街实时同步");
                setTimeout(() => document.getElementById('loading-bar').style.width = '0', 500);
            } catch (e) {
                console.warn("网络请求受阻，执行本地推演路径");
                document.getElementById('loading-bar').style.width = '0';
            }
        }

        initMatrixGrid();
        executeFallback(); 
        fetchMarketData();
        setInterval(fetchMarketData, 5 * 60 * 1000);
    </script>
</body>
</html>
