            try {
                // 批量并行获取四大核心指数数据
                const results = await Promise.all(tickers.map(t => 
                    fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.financeapp.yahoo.com/v8/finance/chart/${t}?interval=1d&range=3mo`)}`)

                ));

                parseAndExecute(results);
            } catch (error) {
                console.error("数据源引擎阻断，启动本地保护机制:", error);

                setTimeout(fetchMarketData, 10000); // 10秒后自动重连
            }
        }
