<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuant Matrix Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e17; }
        .card-bg { background-color: #131722; border: 1px solid #1e222d; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-halo { 0%, 100 { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.4); opacity: 0.2; } }
        .animate-halo { animation: pulse-halo 2s infinite ease-in-out; }
    </style>
</head>
<body class="text-slate-100 min-h-screen font-sans antialiased p-4 no-scrollbar">

    <div class="max-w-md mx-auto flex flex-col gap-4">

        <div class="card-bg rounded-2xl p-6 text-center shadow-lg relative overflow-hidden">
            <div class="text-slate-400 text-sm font-medium tracking-wide">今日纳指 ETF 建议总仓位</div>
            <div id="big-position" class="text-6xl font-black text-[#ffb800] my-4 tracking-tight">--%</div>
            
            <div class="inline-flex items-center gap-2 bg-[#1b2030]/60 px-4 py-2 rounded-full border border-slate-800/80 mx-auto">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                <span id="status-text" class="text-xs text-slate-300 font-medium">正在计算解算器坐标...</span>
            </div>
        </div>

        <div class="card-bg rounded-2xl p-5 shadow-lg flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <div class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
                    <span>💰</span> 5万现金战术协同面板
                </div>
                <div id="risk-badge" class="text-[10px] px-2 py-0.5 rounded border font-bold bg-slate-900 border-slate-700 text-slate-400">
                    计算中
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 text-center font-mono text-xs">
                <div class="bg-[#171b26] p-2.5 rounded-xl border border-slate-800/40">
                    <div class="text-slate-500 text-[10px] mb-1">纳指 ETF</div>
                    <div class="text-emerald-400 font-bold">5.40万</div>
                    <div class="text-emerald-500/80 text-[10px] mt-0.5">浮盈 +25%</div>
                </div>
                <div class="bg-[#171b26] p-2.5 rounded-xl border border-slate-800/40">
                    <div class="text-slate-500 text-[10px] mb-1">对冲黄金</div>
                    <div class="text-[#ffb800] font-bold">5.50万</div>
                    <div class="text-emerald-500/80 text-[10px] mt-0.5">浮盈 +6%</div>
                </div>
                <div class="bg-[#171b26] p-2.5 rounded-xl border border-slate-800/40">
                    <div class="text-slate-500 text-[10px] mb-1">待发弹药</div>
                    <div class="text-blue-400 font-bold">5.00万</div>
                    <div class="text-slate-500 text-[10px] mt-0.5">现金持仓</div>
                </div>
            </div>

            <div class="bg-[#171b26]/80 border border-slate-800/60 rounded-xl p-3">
                <div class="text-xs font-bold text-slate-400 flex items-center gap-1 mb-1">
                    <span>🎯</span> 战术加仓机械化指令
                </div>
                <div id="tactical-cmd-box" class="text-xs leading-relaxed font-mono text-slate-300">
                    正在连线华尔街多维数据中心，请稍候...
                </div>
            </div>
        </div>

        <div class="card-bg rounded-2xl p-5 shadow-lg flex flex-col gap-3">
            <div class="text-xs font-semibold text-slate-400 font-mono flex justify-between">
                <span>📊 二维动态坐标矩阵 (高精流体版)</span>
                <span id="coord-display" class="text-slate-500">当前 X: --, Y: --</span>
            </div>

            <div class="relative w-full aspect-square bg-[#090b11] border border-[#1e222d] rounded-xl overflow-hidden shadow-inner">
                <div class="absolute inset-0 border-b border-dashed border-slate-800/40 top-1/2"></div>
                <div class="absolute inset-0 border-l border-dashed border-slate-800/40 left-1/2"></div>
                
                <div class="absolute top-0 left-0 w-1/2 h-1/2 bg-red-950/5"></div>
                <div class="absolute top-0 right-0 w-1/2 h-1/2 bg-emerald-950/5"></div>

                <div id="trail-white" class="absolute w-2 h-2 bg-white rounded-full opacity-40 shadow-[0_0_6px_#fff] -translate-x-1/2 -translate-y-1/2 transition-all duration-1000" style="left:50%; top:50%;"></div>
                <div id="trail-blue" class="absolute w-2.5 h-2.5 bg-sky-400 rounded-full opacity-60 shadow-[0_0_8px_#38bdf8] -translate-x-1/2 -translate-y-1/2 transition-all duration-1000" style="left:50%; top:50%;"></div>
                <div id="trail-orange" class="absolute w-2.5 h-2.5 bg-orange-400 rounded-full opacity-80 shadow-[0_0_8px_#fb923c] -translate-x-1/2 -translate-y-1/2 transition-all duration-1000" style="left:50%; top:50%;"></div>
                
                <div id="radar-pointer" class="absolute w-4 h-4 bg-gradient-to-br from-rose-400 to-red-600 rounded-full shadow-[0_0_15px_rgba(244,63,94,0.9)] border border-white -translate-x-1/2 -translate-y-1/2 transition-all duration-700 ease-out" style="left: 50%; top: 50%;">
                    <div class="absolute inset-0 rounded-full bg-rose-500 animate-halo"></div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 text-[10px] font-mono mt-1 text-slate-400">
                <div class="bg-[#171b26]/50 p-1.5 rounded border border-slate-900 text-center">
                    美债^TNX: <span id="lbl-tnx" class="text-white font-bold">--</span>
                </div>
                <div class="bg-[#171b26]/50 p-1.5 rounded border border-slate-900 text-center">
                    恐慌^VXN: <span id="lbl-vxn" class="text-white font-bold">--</span>
                </div>
                <div class="bg-[#171b26]/50 p-1.5 rounded border border-slate-900 text-center">
                    半导体%: <span id="lbl-soxx" class="text-white font-bold">--</span>
                </div>
            </div>
            <div class="text-[9px] text-slate-600 font-mono text-right" id="lbl-time">数据同步状态: 初始化...</div>
        </div>

    </div>

    <script>
        // 连续平滑仓位矩阵
        const POSITION_MATRIX = [
            [45, 52, 61, 67, 73, 80, 85], // Y = +2.00
            [42, 49, 58, 64, 70, 77, 82], // Y = +1.33
            [39, 46, 54, 60, 66, 73, 78], // Y = +0.67
            [35, 42, 50, 56, 62, 68, 74], // Y =  0.00
            [30, 37, 45, 51, 57, 63, 69], // Y = -0.67
            [25, 32, 40, 46, 52, 58, 64], // Y = -1.33
            [15, 22, 30, 36, 42, 48, 55]  // Y = -2.00
        ];

        // 工业级高阶解算器（双线性连续空间网格映射）
        function calculateBilinearPosition(x, y) {
            const normX = ((x + 2) / 4) * 6;
            const normY = ((y + 2) / 4) * 6;
            const x1 = Math.max(0, Math.min(5, Math.floor(normX)));
            const x2 = Math.min(6, x1 + 1);
            const y1 = Math.max(0, Math.min(5, Math.floor(normY)));
            const y2 = Math.min(6, y1 + 1);

            const Q11 = POSITION_MATRIX[6 - y1][x1];
            const Q21 = POSITION_MATRIX[6 - y1][x2];
            const Q12 = POSITION_MATRIX[6 - y2][x1];
            const Q22 = POSITION_MATRIX[6 - y2][x2];

            const fx1 = (x2 - normX) * Q11 + (normX - x1) * Q21;
            const fx2 = (x2 - normX) * Q12 + (normX - x1) * Q22;
            return Math.round((y2 - normY) * fx1 + (normY - y1) * fx2);
        }

        // 穿透清洗雅虎数据（全时区稳健日历级接口）
        async function fetchStableStockData(symbol) {
            const cacheBuster = Date.now();
            const targetUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&_=${cacheBuster}`;
            const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&_=${cacheBuster}`;

            const response = await fetch(proxy, { cache: "no-store" });
            if (!response.ok) throw new Error("CORS通道暂避");
            
            const rawWrapper = await response.json();
            const payload = typeof rawWrapper.contents === 'string' ? JSON.parse(rawWrapper.contents) : rawWrapper;
            
            const mainResult = payload?.chart?.result?.[0];
            if (!mainResult) throw new Error("结构受损");

            const currentPrice = mainResult.meta.regularMarketPrice;
            const prevClose = mainResult.meta.chartPreviousClose;
            return {
                price: currentPrice,
                change: ((currentPrice - prevClose) / prevClose) * 100
            };
        }

        // 历史漂移轨迹链维护
        function updateFluidTrail(newX, newY) {
            let history = JSON.parse(localStorage.getItem('mq_fluid_history') || '[]');
            
            if (history.length === 0) {
                history = [
                    { x: -0.65, y: 1.10 }, 
                    { x: -0.42, y: 1.65 }, 
                    { x: 0.10, y: 1.50 }   
                ];
            }

            const lastPoint = history[history.length - 1];
            if (!lastPoint || Math.abs(lastPoint.x - newX) > 0.05 || Math.abs(lastPoint.y - newY) > 0.05) {
                history.push({ x: newX, y: newY });
                if (history.length > 3) history.shift(); 
                localStorage.setItem('mq_fluid_history', JSON.stringify(history));
            }

            const setNodePos = (id, pt) => {
                if (!pt) return;
                const dom = document.getElementById(id);
                dom.style.left = `${((pt.x + 2) / 4) * 100}%`;
                dom.style.top = `${(1 - (pt.y + 2) / 4) * 100}%`;
            };

            setNodePos('trail-white', history[0]);
            setNodePos('trail-blue', history[1]);
            setNodePos('trail-orange', history[2]);
            
            const mainPointer = document.getElementById('radar-pointer');
            mainPointer.style.left = `${((newX + 2) / 4) * 100}%`;
            mainPointer.style.top = `${(1 - (newY + 2) / 4) * 100}%`;
        }

        // 核心运行总线
        async function refreshMatrixTerminal() {
            try {
                const [tnx, vxn, soxx] = await Promise.all([
                    fetchStableStockData('^TNX'),
                    fetchStableStockData('^VXN'),
                    fetchStableStockData('SOXX')
                ]);

                // ==========================================
                // 🛠️ 【核心校准】百分之百还原你最初的指标组合方案方案与原始权重参数
                // ==========================================
                const X = -(((tnx.price - 4.20) / 0.5) + ((vxn.price - 18.0) / 6.0));
                const Y = (soxx.change / 1.5);
                // ==========================================

                const boundedX = Math.max(-2, Math.min(2, X));
                const boundedY = Math.max(-2, Math.min(2, Y));

                // 求解仓位
                const recommendedPos = calculateBilinearPosition(boundedX, boundedY);

                // 完美封装历史快照至仓储，用作断网铁壁防御
                const snapshot = { boundedX, boundedY, recommendedPos, tnx: tnx.price, vxn: vxn.price, soxx: soxx.change, ts: new Date().toLocaleTimeString() };
                localStorage.setItem('mq_last_valid_snapshot', JSON.stringify(snapshot));

                // 渲染界面
                renderTerminalUI(snapshot, false);

            } catch (err) {
                console.warn("[网络断流或过载防御] 正在无缝调拨本地历史快照资产...", err);
                const savedSnapshot = localStorage.getItem('mq_last_valid_snapshot');
                if (savedSnapshot) {
                    renderTerminalUI(JSON.parse(savedSnapshot), true);
                } else {
                    // 兜底安全数据
                    const defaultSafe = { boundedX: 0.25, boundedY: 1.65, recommendedPos: 67, tnx: 4.50, vxn: 15.8, soxx: 1.98, ts: "安全离线锁" };
                    renderTerminalUI(defaultSafe, true);
                }
            }
        }

        // 视图渲染引擎
        function renderTerminalUI(data, isOffline) {
            const { boundedX, boundedY, recommendedPos, tnx, vxn, soxx, ts } = data;

            // 1. 核心大数字仓位
            document.getElementById('big-position').innerText = `${recommendedPos}%`;

            // 2. 状态胶囊渲染
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            if (boundedX >= 0 && boundedY >= 0) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                txt.innerText = `右上：戴维斯双击区 (流动性宽松+AI强力)`;
            } else if (boundedX < 0 && boundedY >= 0) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
                txt.innerText = `左上：重力蹦迪区 (宏观逆风+AI产业强劲)`;
            } else if (boundedX < 0 && boundedY < 0) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse";
                txt.innerText = `左下：流动性冰河期 (极度防守)`;
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse";
                txt.innerText = `右下：情绪过载陷阱 (多头陷阱)`;
            }

            // 3. 风控特型 Badge
            const badge = document.getElementById('risk-badge');
            if (boundedX < 0) {
                badge.className = "text-[10px] px-2 py-0.5 rounded border font-bold bg-[#3b2314] border-amber-600 text-amber-400";
                badge.innerText = "左侧突击型";
            } else {
                badge.className = "text-[10px] px-2 py-0.5 rounded border font-bold bg-[#122e1f] border-emerald-600 text-emerald-400";
                badge.innerText = "标准稳健版";
            }

            // 4. 机械化指令
            const cmdBox = document.getElementById('tactical-cmd-box');
            if (boundedX < -1.2 && boundedY < -0.5) {
                cmdBox.innerHTML = `<span class="text-rose-400 font-bold">【🚀 第二级火箭·终极扫货】</span><br>当前触及极端防御边缘！建议将剩余 35,000 元子弹重仓突击，协同前锋合击绝对底部！`;
            } else if (boundedX < -0.8 || boundedY < 0.2) {
                cmdBox.innerHTML = `<span class="text-amber-400 font-bold">【🏹 第一级火箭·前锋低吸】</span><br>建议动用待发弹药中的 15,000 元开始低吸。35,000 元子弹锁死防御。`;
            } else {
                cmdBox.innerHTML = `<span class="text-slate-200 font-bold">【💤 蓄势守候·持币观望】</span><br>大盘处于常规中性震荡区间，5万子弹继续锁定，静待雷达信号。`;
            }

            // 5. 数据面板与多流体粒子轨迹更新
            document.getElementById('coord-display').innerText = `当前 X: ${boundedX >= 0 ? '+' : ''}${boundedX.toFixed(2)}, Y: ${boundedY >= 0 ? '+' : ''}${boundedY.toFixed(2)}`;
            document.getElementById('lbl-tnx').innerText = `${tnx.toFixed(2)}%`;
            document.getElementById('lbl-vxn').innerText = vxn.toFixed(1);
            document.getElementById('lbl-soxx').innerText = `${soxx >= 0 ? '+' : ''}${soxx.toFixed(2)}%`;
            document.getElementById('lbl-time').innerText = `更新时间: ${ts} ${isOffline ? '(离线守卫激活)' : '(全时同步中)'}`;

            // 驱动多粒子轨迹漂移
            updateFluidTrail(boundedX, boundedY);
        }

        // 初始化挂载
        window.addEventListener('DOMContentLoaded', () => {
            refreshMatrixTerminal();
            // 每 10 分钟自动在后台刷新数据
            setInterval(refreshMatrixTerminal, 600000);
        });
    </script>
</body>
</html>
